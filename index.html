<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1226">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Royale Coach</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="profile" class="profile"></header>

  <main>
    <section id="tab-session" class="tab active"></section>
    <section id="tab-battles" class="tab"></section>
    <section id="tab-decks" class="tab"></section>
    <section id="tab-insights" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-bar"><button id="sheet-close" class="icon-btn" aria-label="Close">‹ Back</button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <nav class="tabbar">
    <button data-tab="session" class="active"><span>⚡</span>Session</button>
    <button data-tab="battles"><span>⚔️</span>Battles</button>
    <button data-tab="decks"><span>🃏</span>Decks</button>
    <button data-tab="insights"><span>📊</span>Insights</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
