name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test
        run: node --test

      - name: Collect the web app
        run: mkdir www && cp -r index.html style.css manifest.json icon-*.png js www/

      - name: Create the Android project
        run: |
          npm install
          npx cap add android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle

      # The same key signs every build, so a new APK installs over the old one and keeps your data.
      - name: Use the repository's signing key
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk royale-coach.apk
          gh release create "build-${{ github.run_number }}" royale-coach.apk \
            --title "Royale Coach build ${{ github.run_number }}" \
            --notes "Download royale-coach.apk on your Android phone and open it to install."
